server:
  port: 8087
  servlet:
    context-path: /order

spring:
  application:
    name: order-service
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://mysql:3306/order_service}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  services:
    coin: ${COIN_SERVICE_URL:http://coin-service:8085/coin}
    wallet: ${WALLET_SERVICE_URL:http://wallet-service:8086/wallet}