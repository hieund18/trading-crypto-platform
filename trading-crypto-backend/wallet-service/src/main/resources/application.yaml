server:
  port: 8086
  servlet:
    context-path: /wallet

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://mysql:3306/wallet_service}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  services:
    otp: ${OTP_SERVICE_URL:http://otp-service:8081/otp}
    identity: ${IDENTITY_SERVICE_URL:http://identity-service:8080/identity}
