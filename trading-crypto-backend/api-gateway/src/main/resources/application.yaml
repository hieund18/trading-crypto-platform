server:
  port: 8888

app:
  api-prefix: /api/v1
  services:
    identity: http://identity-service:8080/identity
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
      - id: identity_service
        uri: http://identity-service:8080
        predicates:
        - Path=${app.api-prefix}/identity/**
        filters:
        - StripPrefix=2
      - id: profile_service
        uri: http://profile-service:8083
        predicates:
        - Path=${app.api-prefix}/profile/users/**
        filters:
        - StripPrefix=2
      - id: file_service
        uri: http://file-service:8084
        predicates:
        - Path=${app.api-prefix}/file/**
        filters:
        - StripPrefix=2
      - id: coin_service
        uri: http://coin-service:8085
        predicates:
        - Path=${app.api-prefix}/coin/**
        filters:
        - StripPrefix=2
        - DedupeResponseHeader=Access-Control-Allow-Origin
      - id: coin_service_websocket
        uri: ws://coin-service:8085
        predicates:
        - Path=${app.api-prefix}/coin/ws/**
        filters:
        - StripPrefix=2
      - id: wallet_service
        uri: http://wallet-service:8086
        predicates:
        - Path=${app.api-prefix}/wallet/wallets/**
        filters:
        - StripPrefix=2
      - id: order_service
        uri: http://order-service:8087
        predicates:
        - Path=${app.api-prefix}/order/**
        filters:
        - StripPrefix=2
